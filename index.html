  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6), inset 0 0 60px rgba(0,0,0,.55);
  padding:20px 20px 22px;
}
.lg-top{border-bottom:1px dashed rgba(216,169,75,.22);padding-bottom:12px;align-items:center}
.lg-timer{
  font-family:var(--mono);font-size:13px;color:var(--brass-2);letter-spacing:.08em;
  border:1px solid rgba(216,169,75,.32);background:linear-gradient(180deg,#1d1710,#120e09);
  padding:5px 11px;border-radius:2px;
}
.lg-mode{border-radius:2px;border-color:rgba(216,169,75,.24)}
.lg-mode .seg-btn{font-size:12.5px;letter-spacing:.08em}
.lg-tools .btn{border-radius:2px}

.lg-grid{
  background:
    repeating-linear-gradient(0deg, rgba(216,169,75,.04) 0 1px, transparent 1px 44px),
    #0e0a07;
  border:2px solid rgba(216,169,75,.22);
  border-radius:2px;padding:10px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.8);
}
.lg-head{border-bottom:1px solid rgba(216,169,75,.18)}
.lg-row{padding:2px 0}
.lg-row-h{
  font-family:var(--serif);color:#e8dcc2;letter-spacing:.04em;
  border-right:1px dashed rgba(216,169,75,.14);padding-right:8px;
}
.lg-emo{filter:grayscale(.35) sepia(.25)}
.lg-cell{
  background:linear-gradient(180deg,#14100b,#0b0806);
  border:1px solid rgba(216,169,75,.14);border-radius:2px;height:44px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.65);color:#c9b389;
}
.lg-cell:hover{
  border-color:rgba(240,205,130,.6);
  box-shadow:inset 0 0 14px rgba(216,169,75,.18), 0 0 0 1px rgba(216,169,75,.25);
}
.lg-cell.placed{
  background:linear-gradient(180deg,#f2d493,#c79a3f);
  border-color:#e7c274;color:#2a1c06;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,0,0,.3), 0 2px 8px -2px rgba(0,0,0,.8);
}
.lg-cell.placed .lg-tok{animation:stamp .22s ease-out}
@keyframes stamp{from{transform:scale(1.45);opacity:.25}to{transform:none;opacity:1}}
.lg-cell.mark{background:rgba(90,55,30,.35);border-style:dashed;border-color:rgba(216,169,75,.3)}
.lg-cell.hl{box-shadow:inset 0 0 0 2px rgba(240,205,130,.85), inset 0 0 18px rgba(216,169,75,.25)}
.lg-pos{font-family:var(--mono);font-size:11px;color:var(--gold-dim)}

.lg-side{
  background:linear-gradient(170deg,#1b1510,#0e0a07);
  border:1px solid rgba(216,169,75,.24);border-radius:2px;padding:16px 14px;position:relative;
  max-height:calc(100vh - 150px);overflow-y:auto;
}
.lg-side::before{
  content:"";position:absolute;top:-5px;left:16px;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f6dda2,#9a7226);box-shadow:0 1px 2px rgba(0,0,0,.8);
}
.lg-side h4{font-size:13px;letter-spacing:.14em;color:var(--gold-dim)}
.lg-clues{gap:9px}
.lg-clue{
  background:linear-gradient(180deg,#e9dfc7,#d9c9a6);
  color:#2a1c06;border:none;border-left:3px solid #b98a33;border-radius:1px;
  font-family:var(--serif);font-size:12px;line-height:1.45;padding:6px 9px;
  box-shadow:0 2px 6px rgba(0,0,0,.5);transition:.15s;
}
.lg-clue:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.6)}
.lg-clue.hard{border-left-color:#a4472f}

/* ---------- 房间：一列或几列组成一个区域，区域首格立墙 ---------- */
.lg-col-h{
  font-family:var(--serif);font-size:12.5px;color:#c9bda4;letter-spacing:.04em;
  padding-bottom:5px;line-height:1.2;
}
.lg-col-h.room-first{color:#e8dcc2;border-left:2px solid rgba(216,169,75,.45);padding-left:7px}
.lg-col-h.room-cont{color:#6f6353}
.lg-col-h .cont-mark{opacity:.55}
.lg-cell{border-left:1px solid rgba(216,169,75,.07)}
.lg-cells > .lg-cell:first-child{border-left:2px solid rgba(216,169,75,.32)}
.lg-cell.room-start{border-left:2px solid rgba(216,169,75,.42)}
.lg-cell.room-odd{background:linear-gradient(180deg,#151009,#0b0806)}
.lg-victim{
  margin:6px 0 10px;padding:7px 9px;border:1px solid rgba(196,86,74,.35);
  background:rgba(196,86,74,.07);color:#e0b3a9;font-size:12px;line-height:1.5;border-radius:2px;
  display:flex;align-items:center;gap:6px;
}
.lg-victim b{color:#e08276;letter-spacing:.1em}
.lg-victim span{margin-left:auto;font-size:10.5px;color:#b08a84;white-space:nowrap}
.lg-testis{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.lg-testi{
  font-size:11.5px;line-height:1.4;color:#cfc3ab;padding:4px 7px;border-radius:1px;
  border-left:2px solid rgba(154,140,240,.5);background:rgba(154,140,240,.06);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lg-testi b{color:#b8a9e8;font-weight:600;margin-right:3px}

/* ---------- 标题下的规矩条 ---------- */
.howto{
  margin-top:12px;padding:10px 14px 10px 12px;max-width:78ch;
  border-left:2px solid rgba(216,169,75,.5);
  background:linear-gradient(90deg,rgba(216,169,75,.08),rgba(216,169,75,0) 72%);
  color:#a89a83;font-size:12.5px;line-height:1.85;
}
.howto b{color:var(--gold);font-weight:600}
.howto i{color:var(--dim);font-style:normal}


/* ---------- 不规则房间：区域底色、隔墙、房名 ---------- */
.lg-cell{position:relative}
.lg-col-h.num{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center}
.lg-cell:not(.placed):not(.mark).room-0{background:#100c08}
.lg-cell:not(.placed):not(.mark).room-1{background:#131109}
.lg-cell:not(.placed):not(.mark).room-2{background:#0f0d0b}
.lg-cell:not(.placed):not(.mark).room-3{background:#12100b}
.lg-cell:not(.placed):not(.mark).room-4{background:#0e0c09}
.lg-cell.wall-l{border-left:2px solid rgba(216,169,75,.45)}
.lg-cell.wall-t{border-top:2px solid rgba(216,169,75,.45)}
.room-tag{
  position:absolute;top:3px;left:5px;pointer-events:none;
  font-family:var(--serif);font-size:9.5px;letter-spacing:.06em;
  color:rgba(216,169,75,.55);
}

/* 房名标签与区域底色微调 */
.lg-cell:not(.placed):not(.mark).room-0{background:#100c08}
.lg-cell:not(.placed):not(.mark).room-1{background:#13100a}
.lg-cell:not(.placed):not(.mark).room-2{background:#0d100e}
.lg-cell:not(.placed):not(.mark).room-3{background:#121010}
.lg-cell:not(.placed):not(.mark).room-4{background:#0f0d12}
.room-tag{
  position:absolute;top:3px;left:4px;pointer-events:none;z-index:1;
  font-family:var(--serif);font-size:10px;letter-spacing:.08em;
  color:rgba(232,214,176,.62);
  background:rgba(10,8,6,.55);padding:0 3px;border-radius:1px;
}

/* ---------- 家具：占格、不能站人 ---------- */
.lg-cell.prop{
  background:repeating-linear-gradient(45deg,#161009 0 6px,#1b140c 6px 12px);
  border:1px dashed rgba(216,169,75,.38);
}
.lg-cell.prop .prop-tag{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:11px;line-height:1.15;letter-spacing:.03em;
  color:#d8b877;text-align:center;padding:2px;pointer-events:none;
}

/* 侧栏分组与紧凑排布 */
.lg-sub{
  display:flex;align-items:center;gap:8px;margin:2px 0 6px;
  font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--gold-dim);
}
.lg-sub::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(216,169,75,.28),transparent)}
.lg-clues{gap:6px}

/* ---------- 线索详情 / 未启的档 ---------- */
.lg-full{
  margin-top:10px;padding:8px 10px;border:1px dashed rgba(216,169,75,.38);border-radius:2px;
  background:rgba(216,169,75,.05);color:#e6dcc4;font-size:12px;line-height:1.65;
}
.lg-full b{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;
  color:var(--gold-dim);margin-bottom:3px;font-weight:400;
}
.pick.locked{opacity:.55;cursor:pointer}
.pick.locked:hover{transform:none;border-color:rgba(216,169,75,.2);background:var(--panel)}

/* ---------- 笔记收口 / 接龙写作 / 结案页 ---------- */
.notes{max-height:calc(100vh - 150px)}
.note-list{max-height:44vh}
.note{font-size:12px;padding:7px 9px;line-height:1.55}
.cc-retell textarea{
  width:100%;margin-top:12px;padding:10px 12px;border-radius:2px;outline:none;resize:vertical;
  background:#0d0a07;border:1px solid rgba(216,169,75,.22);color:#efe5d3;
  font:inherit;font-size:13.5px;line-height:1.75;font-family:var(--serif);
}
.cc-retell textarea:focus{border-color:rgba(240,205,130,.6)}

/* ---------- 剧本杀：横排页签 ---------- */
.script-tabs{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.script-status{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold-dim)}
.script-main .card{padding:22px 24px}

/* 笔记限高，别把侧栏拉长 */
.note-list{max-height:min(40vh,320px)}

/* 线索栏/场景栏贴顶，别悬在页头下面 */
.case-nav{top:16px}
.notes{top:16px;align-self:start}

/* ============ 单人剧本杀：剧本夹 ============ */
.script-tabs .seg{border-radius:2px;border-color:rgba(216,169,75,.28);background:#120e0a}
.script-tabs .seg-btn{padding:9px 18px;font-family:var(--serif);letter-spacing:.1em;font-size:13.5px}
.script-tabs .seg-btn.on{background:linear-gradient(180deg,rgba(216,169,75,.2),rgba(216,169,75,.05));color:var(--brass-2)}
.script-main .card{
  background:
    radial-gradient(120% 80% at 50% -20%, rgba(216,169,75,.07), transparent 60%),
    linear-gradient(170deg,#1a1410,#0f0b08);
  border:1px solid rgba(216,169,75,.28);
  padding:26px 30px;
}
.script-main .brief{font-size:15px;line-height:2;color:#e6dcc4}
.script-main .brief p{margin:0 0 14px}
.script-role{
  background:linear-gradient(160deg,#1b1510,#110d09);
  border:1px solid rgba(216,169,75,.18);border-left:3px solid rgba(216,169,75,.5);
  border-radius:2px;padding:14px 16px;margin-bottom:10px;
}
.script-role .sr-name{font-size:17px;color:var(--brass-2)}
.script-role .sr-name span{color:var(--gold-dim)}
.script-role .sr-bio{color:#b7a992;font-size:13.5px;line-height:1.85}
.brief .note{
  background:linear-gradient(180deg,#17120c,#0f0b07);
  border:1px solid rgba(216,169,75,.2);border-radius:2px;
  padding:12px 14px;margin-bottom:9px;
}
.brief .note b{font-family:var(--serif);letter-spacing:.03em;color:#efe5d3}
.brief .note.key{border-color:rgba(196,86,74,.45);background:rgba(196,86,74,.06)}
.brief .note.got{border-color:rgba(143,176,122,.45)}
.brief .note .ev-d{color:#b7a992}

/* ============ 密室逃脱：现场 ============ */
.escape-wrap{display:grid;grid-template-columns:1fr 296px;gap:18px;align-items:start}
.escape-room{
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(216,169,75,.07), transparent 60%),
    linear-gradient(170deg,#1a1410,#0e0a07);
  border:1px solid rgba(216,169,75,.28);padding:22px 24px;
}
.escape-room h4,.escape-inv h4{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;color:var(--gold-dim);
  text-transform:uppercase;margin:0 0 12px;
}
.esc-text{font-family:var(--serif);font-size:15px;line-height:2.05;color:#e6dcc4;margin:0 0 18px}
.esc-actions{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.esc-act{
  display:block;width:100%;text-align:left;padding:11px 14px;border-radius:2px;cursor:pointer;
  background:linear-gradient(180deg,#17120c,#0f0b07);
  border:1px solid rgba(216,169,75,.2);color:#e6dcc4;font:inherit;font-size:13.5px;
  transition:.16s;
}
.esc-act::before{content:"▸ ";color:var(--gold-dim)}
.esc-act:hover{border-color:rgba(240,205,130,.55);transform:translateX(2px);color:var(--brass-2)}
.esc-act.done,.esc-act.done::before{color:var(--dim);cursor:default;transform:none}
.esc-log{
  font-family:var(--mono);font-size:12px;line-height:1.9;color:#9a8d78;
  border-top:1px dashed rgba(216,169,75,.2);padding-top:12px;max-height:180px;overflow:auto;
}
.esc-log-line.dim{color:var(--dim)}
.escape-inv{
  background:linear-gradient(170deg,#1a1410,#0e0a07);
  border:1px solid rgba(216,169,75,.24);padding:18px;
}
.inv-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.inv-chip{
  background:linear-gradient(180deg,#241c13,#14100a);
  border:1px solid rgba(216,169,75,.3);color:#e6dcc4;border-radius:2px;
  padding:6px 10px;font-size:12.5px;cursor:pointer;
}
.inv-chip:hover{border-color:var(--brass-2);color:var(--brass-2)}
.inv-empty{color:var(--dim);font-size:12.5px}
.inv-tip{color:var(--dim);font-size:12px;line-height:1.8;margin:6px 0 0}
@media(max-width:900px){.escape-wrap{grid-template-columns:1fr}}

/* 剧本杀：章节栏 */
.script-layout{display:grid;grid-template-columns:212px 1fr;gap:20px;align-items:start}
.script-rail{
  position:sticky;top:16px;padding:14px 12px;
  background:linear-gradient(170deg,#1a1410,#0e0a07);
  border:1px solid rgba(216,169,75,.24);border-radius:2px;
}
.rail-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--gold-dim);margin-bottom:8px}
.rail-tab{
  display:block;width:100%;text-align:left;margin-bottom:5px;padding:9px 12px;
  background:transparent;border:1px solid transparent;border-left:2px solid rgba(216,169,75,.18);
  color:#a89a83;font:inherit;font-family:var(--serif);font-size:13.5px;letter-spacing:.08em;cursor:pointer;
  border-radius:0 2px 2px 0;transition:.16s;
}
.rail-tab:hover{color:#e6dcc4;background:rgba(216,169,75,.06)}

<script>
/* ============ 存档 & 工具 ============ */
const Store = (() => {
  const KEY = 'mindhunt.save.v1';
  const blank = () => ({
    pts: 0,
    soup: {},        // { [id]: {solved:true, asks:n} }
    spot: {},        // { [id]: {best: ms, clears:n} }
    cases: {},       // { [id]: {solved:true, score:n} }
    detect: {},      // { [id]: {solved:true, score:n} }
    deduction: { su: {} },   // { su:{[diff]:{best,bestScore,clears}}, solved:n, kills:{solved,best} }
    escape: {},      // { solved:n, best:n }
    crypto: {},      // { crack: { [id]: {solved:true, best:secs} } }
    sm: {},          // { games:n, wins:n, best:n } 多人同屏海龟汤
    chain: {},       // { [id]: {solved:true, attempts:n}, best:n } 线索接龙
    scripts: {},      // { [id]: {solved:true, score:n} } 单人剧本杀
  });
  let data = blank();

  /* 探测 localStorage 是否真的可写。
     沙箱预览 iframe / 隐私模式下写入会抛异常——此时进度根本存不下来，
     解锁阶梯若照常生效，后面的科室就会被永久锁死，所以必须能识别这种情况。 */
  let available = true;
  try {
    const probe = KEY + '.probe';
    localStorage.setItem(probe, '1');
    localStorage.removeItem(probe);
  } catch (e) { available = false; }

  try {
    const raw = localStorage.getItem(KEY);
    if (raw) data = Object.assign(blank(), JSON.parse(raw));
  } catch (e) { console.warn('存档读取失败', e); }

  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  };

  return {
    get d() { return data; },
    get available() { return available; },
    save,
    addPts(n) {
      data.pts += n; save();
      const el = document.querySelector('.rank-pts');
      if (el) {
        el.textContent = data.pts;
        el.classList.add('bump');
        setTimeout(() => el.classList.remove('bump'), 320);
      }
    },
    reset() { data = blank(); save(); location.reload(); },
  };
})();

/* ---------- 通用工具 ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const fmtTime = ms => {
  const t = Math.max(0, Math.floor(ms / 1000));
  return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
};

const shuffle = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const toast = (msg, kind = '') => {
  const wrap = $('#toastWrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .35s, transform .35s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(10px)';
    setTimeout(() => el.remove(), 360);
  }, 1900);
};

/* 弹层 */
const Modal = {
  open(html) {
    const mask = $('#modalMask'), box = $('#modalBox');
    box.innerHTML = html;
    mask.hidden = false;
    mask.onclick = e => { if (e.target === mask) Modal.close(); };
  },
  close() { $('#modalMask').hidden = true; $('#modalBox').innerHTML = ''; },
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') Modal.close();
});

/* 轻量音效（WebAudio 合成，无外部资源） */
const Sfx = (() => {
  let ctx = null, on = true;
  const ac = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  };
  const tone = (f, dur, type = 'sine', vol = .06, delay = 0) => {
    if (!on) return;
    try {
      const c = ac(), o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, c.currentTime + delay);
      g.gain.linearRampToValueAtTime(vol, c.currentTime + delay + .012);
      g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + delay + dur);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + delay); o.stop(c.currentTime + delay + dur + .02);
    } catch (e) {}
  };
  return {
    tick: () => tone(880, .07, 'triangle', .04),
    good: () => { tone(660, .1, 'sine', .05); tone(990, .16, 'sine', .05, .08); },
    bad:  () => tone(180, .22, 'sawtooth', .04),
    win:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'sine', .055, i * .1)),
    toggle(){ on = !on; return on; }
  };
})();

</script>

`【真相 · 家宴上的那杯酒】

老爷不是醉死的，是被人注了乌头碱。

那瓶酒同席皆饮，瓶里干干净净——毒不在瓶，在老爷手边那只公用醒酒器。下毒者趁起身添酒，用袖中微型针管把毒注进醒酒器里老爷专用的分酒口；老爷的杯最先斟、那份先注，于是满桌只有他一人倒下。

监控拍到了：弟弟乔锐独自走近醒酒器，"顺手帮他哥那份也注了点"。

所有人都先疑妻子——她当众吵过架，可她同瓶饮酒安然无恙，根本没独碰过什么。真凶是弟弟：老爷刚把公司 30% 持股提给他，而他那笔债，月底就爆。毒夺产，动机与时间线严丝合缝。

针管被他扔进厨房垃圾桶，自以为神不知鬼不觉。

他几乎成功了：共享的酒瓶、吵过架的妻子、一笔漂亮的"自然猝死"。只差一根针管——那只带苦杏味的微型注射器，把他钉死在醒酒器旁。`,

    truth: `老祁不是自然离世，也不是被什么"神秘客"害的。

那第七件小码湿外套，是祁月的。她没在签到簿上签字——是趁着雪夜，偷偷溜进庄里来的。账上的挪用快瞒不住了，她赌一把：用那把福伯"去年就丢了的"备用钥匙进门，在老祁的红茶里下了镇静剂。

      desc: '屋子还留着味道。物件不会说话，人会说谎。',
      tags: [`<span class="tag violet">${DETECT.length} 起案件</span>`, '<span class="tag">问话</span>'],
      total: () => DETECT.length, prog: P => P.detect,
    },
    script: {
      title: '单人剧本杀', icon: 'mask', href: '#/script',
      desc: '一局写好的戏，六个人，六份说辞。只有一份经不起追问。',
      tags: [`<span class="tag violet">${SCRIPTS.length} 部剧本</span>`, '<span class="tag">独幕</span>'],
      total: () => SCRIPTS.length, prog: P => P.script,
    },
    escape: {
      title: '密室逃脱', icon: 'lock', href: '#/escape',
      desc: '门从外面锁上，屋里没有别人。有什么能用的，得你自己摸出来。',
      tags: [`<span class="tag cyan">${ESCAPES.length} 部剧本</span>`, '<span class="tag">夜读</span>'],
      total: () => ESCAPES.length, prog: P => P.escape,
    },
    science: {
      title: '科普', icon: 'cipher', href: '#/science',
      desc: '查案用得上的常识：密码、痕迹、时间。',
      tags: ['<span class="tag gold">常开</span>'],
      total: () => 1, prog: P => 0,
    },
  };

  /* 各板块「通关了几局」——解锁判定与进度条共用同一套口径 */
  function progress() {
    const d = Store.d;
    const cnt = (o, f) => Object.values(o || {}).filter(f).length;
    return {
      soup:   cnt(d.soup, x => x && x.solved),
      spot:   cnt(d.spot, x => x && x.clears > 0),
      logic:  cnt(d.logic, x => x && x.solved) || (d.deduction && d.deduction.solved) || 0,
      'clue-chain': cnt(d.chain, x => x && x.solved),
      case:   cnt(d.cases, x => x && x.solved),
      detect: cnt(d.detect, x => x && x.solved),
      script: cnt(d.scripts, x => x && x.solved),
      escape: (d.escape && d.escape.solved) || 0,
      crypto: cnt((d.crypto && d.crypto.crack) || {}, x => x && x.solved),
    };
  }

  /* 分级解锁：两卷一档，玩通上一档任意一关，这一档两卷一起开。科普常开。 */
  const TIERS = [
    ['soup', 'spot'],
    ['clue-chain', 'logic'],
    ['case', 'detect'],
    ['script', 'escape'],
  ];

  function unlockState() {
    const p = progress();
    const open = {};
    if (!Store.available) { BOARD_ORDER.forEach(b => { open[b] = true; }); return open; }
    open.science = true;                       // 科普不用解锁
    TIERS.forEach((tier, ti) => {
      const prev = ti > 0 ? TIERS[ti - 1] : null;
      const ok = ti === 0
        || (prev && prev.some(b => p[b] >= 1))
        || tier.some(b => p[b] >= 1);
      tier.forEach(b => { open[b] = ok; });
    });
    // 旧存档：某一档里已经通关过，它自己与之前各档都该开着
    TIERS.forEach((tier, ti) => {
      if (tier.some(b => p[b] >= 1)) {
        for (let k = 0; k <= ti; k++) TIERS[k].forEach(b => { open[b] = true; });
      }
    });
    return open;
  }

  // 仅对板块判定锁；home 等非板块入口永远不锁
  const isLocked = board => !!board && BOARD_ORDER.includes(board) && !unlockState()[board];

  function nav(path, push) {
    const [name, ...rest] = String(path || '').split('/').filter(Boolean);
    // 未解锁的板块：拦回大厅并说明条件，避免用地址栏绕过顺序
    if (isLocked(name)) {
      current = { name: 'home', rest: [] };
      draw();
      lockedNotice(name);
      return;
    }
    current = { name: name || 'home', rest };
    draw();
    // 只做 URL 同步，失败（沙箱环境）也不影响使用
    try {
      const h = '#/' + String(path || '').replace(/^\/+/, '');
      if (!history || !history.replaceState) return;
      if (push && history.pushState) history.pushState(null, '', h);  // 用户点击：留历史
      else history.replaceState(null, '', h);                          // 同步/后退：不留
    } catch (e) {}
  }

  function draw() {
    const { name, rest } = current;
    const fn = routes[name] || routes.home;
    Modal.close();                       // 换页时收掉可能还开着的弹层
    const view = $('#view');
    // 同步渲染：不用 setTimeout 兜底。预览窗格 / 后台标签页会冻结定时器，
    // 那样页面会停在「顶栏有了、正文是空的」状态，看起来就像内容全丢了。
    try { fn(rest); } catch (e) { console.error(e); }
    // 入场动效交给 CSS 动画；即使动画不跑，正文也已经是可见的
    view.classList.remove('view-in');
    void view.offsetWidth;               // 强制重排，让动画能重新触发
    view.classList.add('view-in');
    $$('.nav a').forEach(a => {
      a.classList.toggle('on', a.dataset.nav === name);
      a.classList.toggle('locked', isLocked(a.dataset.nav));
    });
    try { window.scrollTo({ top: 0 }); } catch (e) {}
  }

  function hashNow() {
    try { return (location.hash || '').replace(/^#\/?/, '') || 'home'; } catch (e) { return 'home'; }
  }

  /* ---------- 大厅 ---------- */
  function renderHome() {
    const d = Store.d;
    const P = progress();
    const smDone = (d.sm && d.sm.wins) || 0;
    const pct = (a, b) => Math.min(100, Math.round((a / b) * 100));

    // 板块按 BOARD_ORDER 依次排开：前两块默认开，之后每块要通关紧挨的上一块才亮
    const cards = BOARD_ORDER.map((b, i) => {
      const m = BOARD_META[b];
      const locked = isLocked(b);
      const prevTitle = i > 0 ? BOARD_META[BOARD_ORDER[i - 1]].title : '';
      return board({
        idx: i + 1, key: b, href: m.href, icon: m.icon, title: m.title,
        desc: m.desc, tags: m.tags,
        prog: pct(m.prog(P), m.total()),
        locked, need: locked ? '暂未解锁' : '',
      });
    }).join('');

    $('#view').innerHTML = `
      <section class="hero">
        <div class="hero-body">
          <div class="page-head" style="margin-bottom:0">
            <div class="kicker">COMPASS BUREAU</div>
          </div>
          <h1>欢迎回来，探员。</h1>
          <p class="hero-sub"><em>所里又积攒了不少案子。</em></p>
          <p>本所接的委托，大多上不了报纸。有人丢了一只箱子，有人丢了一整年的名声，也有人只是想知道，某年某月某一天，某个人为什么没有回家。委托人坐在对面，把话讲一遍，再讲一遍；两遍之间对不上的地方，通常就是案子的开头。</p>
          <p>我们不是警察，也不替人打官司。警察要证据去交差，律师要证据去取胜；我们只要真相，哪怕它不体面。做法说来简单：把能听到的话听完，把能看到的东西看遍，再把不可能的一件件划掉——剩下的，不管多不合常理，都是答案。这活计不靠聪明，靠耐心：同一份口供读三遍，同一条线索追到底。</p>
          <p>架上的卷宗按查法分作九类。有的只剩一个结局，经过要倒着推；有的只有两幅画，差别藏在里面；有的是一句被打散的话，得按因果接回去；有的是一屋子人，各执一词。案子不同，规矩只有一条：先有欺骗，而后才有推理。凶手动手之前，就把局布好了——证词、现场、时间线，样样朝错的方向指。可局总有缝，缝没补严，真相就从那儿漏出来。</p>
          <p>你离开有一阵子了，手生是正常的。架上的卷宗按难易排着，最前面两卷就摆在桌角；从那两卷起手，其余的自会依次打开。不必一上来就目光如炬：好侦探不是一眼看出答案的人，而是肯多问一句「为什么」的人。卷宗在这儿，什么时候翻开，你说了算。</p>
          <div class="hero-stats">
            <div class="hero-stat"><b>${d.pts}</b><span>累计酬金</span></div>
            <div class="hero-stat"><b>${P.soup}/${SOUPS.length}</b><span>已揭汤底</span></div>
            <div class="hero-stat"><b>${P.spot}/${SPOTS.length}</b><span>已勘现场</span></div>
            <div class="hero-stat"><b>${P.case + P.detect}/${CASES.length + DETECT.length}</b><span>已结案件</span></div>
            <div class="hero-stat"><b>${P.logic + P.escape + P.crypto + smDone + P['clue-chain'] + P.script}</b><span>已破谜题</span></div>
          </div>
        </div>
        <div class="hero-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="24" cy="24" r="16.2" fill="none" stroke="currentColor" stroke-width=".6" opacity=".4"/>
            <g stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".75">
              <path d="M24 2.6v3.2M24 42.2v3.2M2.6 24h3.2M42.2 24h3.2"/>
              <path d="M9 9l2.3 2.3M36.7 36.7 39 39M39 9l-2.3 2.3M11.3 36.7 9 39" opacity=".5"/>
            </g>
            <g fill="currentColor" opacity=".22">
              <path d="M24 12 26 22 24 24 22 22Z"/>
              <path d="M24 36 26 26 24 24 22 26Z"/>
              <path d="M12 24 22 22 24 24 22 26Z"/>
              <path d="M36 24 26 22 24 24 26 26Z"/>
            </g>
            <path d="M24 5.5 26.4 22.4 24 24 21.6 22.4Z" fill="#b0473c"/>
            <path d="M24 42.5 26.4 25.6 24 24 21.6 25.6Z" fill="currentColor" opacity=".8"/>
            <circle cx="24" cy="24" r="2.6" fill="currentColor"/>
            <circle cx="24" cy="24" r="1.1" fill="#f0cd82"/>
          </svg>
        </div>
      </section>

      <div class="sect-title">
        <h2>档案柜</h2>
        <span class="sect-badge">已开 ${Object.values(unlockState()).filter(Boolean).length} / ${BOARD_ORDER.length} 卷</span>
        <div class="line"></div>
      </div>

      <div class="board-grid">${cards}</div>
    `;

    $$('.board:not(.locked)').forEach(b => {
      b.addEventListener('mousemove', e => {
        const r = b.getBoundingClientRect();
        b.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        b.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    });
  }

  /* 内置图标见文件顶部全局 ICON 常量，各板块脚本共用 */

  function board({ idx, key, href, icon, title, desc, tags, prog, locked, need }) {
    // 序号改成题名前的档案编号，不再用圆形蜡封
    const no = `<span class="board-no">No.${String(idx).padStart(2, '0')}</span>`;
    // 未解锁：不给地址，点了弹出说明，告诉玩家先结哪一卷
    if (locked) {
      return `
      <div class="board locked" onclick="App.lockedNotice('${key}')">
        <div class="board-icon">${ICON[icon] || ''}</div>
        <h3>${no}${title}</h3>
        <p class="desc">${desc}</p>
        <div class="meta">${tags.join('')}</div>
        <div class="lock-row">${ICON.lock}<span>${esc(need || '尚未开卷')}</span></div>
      </div>`;
    }
    return `
      <a class="board" href="${href}" data-go="${href.replace(/^#\//, '')}">
        <div class="board-icon">${ICON[icon] || ''}</div>
        <h3>${no}${title}</h3>
        <p class="desc">${desc}</p>
        <div class="meta">${tags.join('')}</div>
        <div class="prog"><i style="width:${prog}%"></i></div>
      </a>`;
  }

  /* 未解锁的卷：系统提示样式 */
  function lockedNotice(name) {
    const tierIdx = TIERS.findIndex(t => t.includes(name));
    if (tierIdx < 0 || tierIdx === 0) return;
    const cur = BOARD_META[name].title;
    Modal.open(`
      <div class="sys-note">
        <div class="sys-ico">!</div>
        <div>
          <h3>暂未解锁</h3>
          <p>需要先完成前面的内容，完成后自动解锁。</p>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn primary" onclick="Modal.close()">知道了</button>
      </div>`);
  }

  /* ---------- 帮助已并入各页标题下方，弹窗撤掉 ---------- */

  function boot() {
    try {
      document.querySelector('.rank-pts').textContent = Store.d.pts;
      $('#btnReset').addEventListener('click', () => {
        Modal.open(`
        <h3>销去存档？</h3>
        <p>酬金、已揭的汤底、来找茬的最好成绩、结案记录，都会一并抹掉，且无法找回。</p>
        <div class="modal-foot">
          <button class="btn ghost" onclick="Modal.close()">再想想</button>
          <button class="btn danger" onclick="Store.reset()">确认销去</button>
        </div>`);
      });
      // 统一接管内部跳转：走 JS 换页，不依赖浏览器导航
      document.addEventListener('click', e => {
        const el = e.target.closest && e.target.closest('[data-go]');
        if (!el) return;
        e.preventDefault();
        nav(el.dataset.go, true);
      });

      window.addEventListener('hashchange', () => nav(hashNow()));
      nav(hashNow());
    } catch (e) {
      // 启动失败也要说话：否则只剩顶栏和页脚，看起来像「内容全没了」
      console.error(e);
      const v = $('#view');
      if (v) {
        v.innerHTML = '<div class="card" style="max-width:620px;margin:40px auto">'
          + '<h3>卷宗没能开卷</h3>'
          + '<p>本所的案卷都靠脚本翻页。请用较新的 Edge / Chrome / Firefox 直接打开本文件'
          + '（双击 HTML 即可），别在文件预览窗格或旧版浏览器里看。</p>'
          + '<p style="color:var(--dim);font-size:12.5px">技术信息：' + esc(String((e && e.message) || e)) + '</p>'
          + '</div>';
      }
    }
  }

  return { boot, nav, lockedNotice };
})();

</script>
<script>
/* ============ 海龟汤（单人推理 + 多人同屏） ============ */
const Soup = (() => {
  let st = null;

  const clearTimer = () => { if (st && st.timer) { clearInterval(st.timer); st.timer = null; } };

  /* ---------- 路由入口 ----------
   *  soup         → 列表（默认单人）
   *  soup/multi   → 多人同屏设置
   *  soup/<id>    → 单题（单人玩法）
   */
  function page(id) {
    if (!id) return list();
    if (id === 'multi') return mSetup();
    const s = SOUPS.find(x => x.id === id);
    return s ? play(s) : list();
  }

  /* ---------- 模式切换条（内部选单人/多人） ---------- */
  function modeBar(active) {
    return `<div class="seg soup-mode">
      <button class="seg-btn ${active === 'solo' ? 'on' : ''}" onclick="App.nav('soup',true)">单人推理</button>
      <button class="seg-btn ${active === 'multi' ? 'on' : ''}" onclick="App.nav('soup/multi',true)">多人同屏</button>
    </div>`;
  }

  /* ============================================================
   *  单人推理
   * ============================================================ */
  function list() {
    clearTimer();
    const d = Store.d.soup || {};
    $('#view').innerHTML = `
      <div class="page-head">
        <div class="kicker">LATERAL THINKING · 海龟汤</div>
        <h1>海龟汤</h1>
        <p>一个结局，没有经过——你可以问任何问题，我们只答「是」「否」「无关」。</p>
        
      </div>
      ${modeBar('solo')}
      <div class="pick-list">
        ${SOUPS.map((s, i) => {
          const rec = d[s.id];
          return `<button class="pick ${rec && rec.solved ? 'done' : ''}" onclick="App.nav('soup/${s.id}',true)">
            <span class="n">${String(i + 1).padStart(2, '0')}</span>
            <span class="t">${esc(s.title)}
              <small>${s.tags.map(t => '#' + t).join(' ')} · 难度 ${s.lv}</small>
            </span>
            ${rec && rec.solved
              ? `<span class="tag green">已揭底 · ${rec.asks} 问</span>`
              : `<span class="tag gold">未揭底</span>`}
          </button>`;
        }).join('')}
      </div>
      <div class="card" style="margin-top:22px">
        <div class="spread">
          <div>
            <b style="font-family:var(--serif);letter-spacing:.06em">问话的门道</b>
            <p style="margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.8">
              先定大方向：人为的吗？意外吗？还有第二个人吗？方向定了，再往细处钻。<br>
              别急着问「为什么」，先问「是什么」。
            </p>
          </div>
          <button class="btn ghost sm" onclick="App.help()">所里的规矩</button>
        </div>
      </div>`;
  }

  function play(s) {
    clearTimer();
    st = {
      s,
      t0: Date.now(),
      asks: 0,
      hints: 0,
      revealed: false,
      asked: new Set(),
      timer: null,
    };

    $('#view').innerHTML = `
      <div class="page-head">
        <div class="spread">
          <div>
            <div class="kicker">${s.tags.map(t => '#' + t).join('  ')} · ${s.lv}</div>
            <h1>${esc(s.title)}</h1>
          </div>
          <a class="btn ghost sm" href="#/soup" data-go="soup">← 全部汤题</a>
        </div>
      </div>

      <div class="soup-wrap">
        <div>
          <div class="soup-surface" id="surface">
            <div class="label">汤面 · SURFACE</div>
            <div class="text">${esc(s.surface)}</div>
          </div>

          <div class="card tight" style="margin-top:16px">
            <div class="chat" id="chat">
              <div class="msg a">
                <div class="who">主</div>
                <div class="bubble">汤面在此。你问什么都行，我只答「是」「否」「无关」。请。</div>
              </div>
            </div>
            <div class="askbar">
              <input id="askInput" placeholder="例如：他是因为害怕才这么做的吗？" autocomplete="off" maxlength="80">
              <button class="btn primary" id="askBtn">提问</button>
            </div>
          </div>
        </div>

        <aside class="soup-side">
          <div class="stat-grid">
            <div class="stat"><b id="stAsks">0</b><span>已提问</span></div>
            <div class="stat"><b id="stTime">00:00</b><span>用时</span></div>
          </div>

          <div class="card tight">
            <div class="spread" style="margin-bottom:10px">
              <b style="font-size:13px;letter-spacing:.1em">提示 <span style="color:var(--dim);font-weight:400">（每条折 5 分）</span></b>
              <span class="tag" id="hintTag">0 / 3</span>
            </div>
            <div class="hint-list" id="hintList"></div>
          </div>

          <div class="card tight">
            <div style="display:flex;flex-direction:column;gap:8px">
              <button class="btn primary" id="btnSubmit">我查清了 · 提交推演</button>
              <button class="btn ghost" id="btnBottom">直接看汤底（不计酬金）</button>
            </div>
          </div>
        </aside>
      </div>`;

    renderHints();
    $('#askBtn').onclick = ask;
    $('#askInput').onkeydown = e => { if (e.key === 'Enter') ask(); };
    $('#askInput').focus();
    $('#btnSubmit').onclick = submitGuess;
    $('#btnBottom').onclick = () => reveal(false);

    st.timer = setInterval(() => {
      const el = $('#stTime');
      if (el) el.textContent = fmtTime(Date.now() - st.t0);
    }, 500);
  }

  function renderHints() {
    const box = $('#hintList');
    if (!box) return;
    let html = '';
    for (let i = 0; i < st.s.hints.length; i++) {
      if (i < st.hints) {
        html += `<div class="hint-item"><b>${i + 1}</b>${esc(st.s.hints[i])}</div>`;
      } else if (i === st.hints) {
        html += `<div class="hint-item locked" data-h="${i}">点击解锁第 ${i + 1} 条批注</div>`;
      } else {
        html += `<div class="hint-item locked" style="opacity:.4;cursor:default">第 ${i + 1} 条批注</div>`;
      }
    }
    box.innerHTML = html;
    $$('.hint-item.locked[data-h]', box).forEach(el => {
      el.onclick = () => {
        st.hints++;
        renderHints();
        Sfx.tick();
      };
    });
    const tag = $('#hintTag');
    if (tag) tag.textContent = `${st.hints} / ${st.s.hints.length}`;
  }

  function ask() {
    const input = $('#askInput');
    const q = input.value.trim();
    if (!q) return;
    if (q.length < 2) { toast('问得太短', 'red'); return; }

    const norm = q.replace(/[\s？?。.,，、！!'"“”‘’]/g, '');
    if (st.asked.has(norm)) {
      appendMsg('a', '这个问题问过了，答案照旧。', 'irr');
      input.value = '';
      return;
    }
    st.asked.add(norm);

    appendMsg('q', esc(q));
    input.value = '';

    const hit = match(st.s, norm);
    if (hit) {
      appendMsg('a', esc(hit.a), hit.v);
      if (hit.v === 'yes' || hit.v === 'hint') Sfx.good(); else Sfx.tick();
    } else {
      const f = SOUP_FALLBACK[Math.floor(Math.random() * SOUP_FALLBACK.length)];
      appendMsg('a', esc(f.a), f.v);
      Sfx.tick();
    }

    st.asks++;
    $('#stAsks').textContent = st.asks;
  }

  function match(s, norm) {
    for (const c of s.clues) {
      for (const k of c.k) {
        if (norm.includes(k)) return c;
      }
    }
    return null;
  }

  function appendMsg(kind, html, v) {
    const chat = $('#chat');
    if (!chat) return;
    const el = document.createElement('div');
    el.className = 'msg ' + kind;
    const vmap = { yes: ['是', 'yes'], no: ['否', 'no'], irr: ['无关', 'irr'], hint: ['接近', 'hint'] };
    const badge = v ? `<span class="verdict ${vmap[v][1]}">${vmap[v][0]}</span>` : '';
    el.innerHTML = `<div class="who">${kind === 'q' ? '你' : '主'}</div>
      <div class="bubble">${badge}${html}</div>`;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  function submitGuess() {
    if (st.revealed) return reveal(false);
    Modal.open(`
      <h3>写下你还原的经过</h3>
      <p>不必讲究文采，把关键因果写清即可。写完会一并给出真汤底，由你自己核。</p>
      <textarea id="guessText" rows="5" style="width:100%;background:var(--bg-2);border:1px solid var(--line-2);
        border-radius:9px;padding:11px 13px;color:var(--text);font-family:inherit;font-size:14px;outline:none;resize:vertical"
        placeholder="例如：他先前遇过海难，靠吃同伴的尸体活了下来……"></textarea>
      <div class="modal-foot">
        <button class="btn ghost" onclick="Modal.close()">再想想</button>
        <button class="btn primary" id="guessGo">对一对汤底</button>
      </div>`);
    $('#guessGo').onclick = () => {
      const g = $('#guessText').value.trim();
      if (!g) { toast('总得写两句', 'red'); return; }
      st.guess = g;
      Modal.close();
      reveal(true);
    };
    setTimeout(() => $('#guessText') && $('#guessText').focus(), 60);
  }

  function reveal(fromGuess) {
    if (st.revealed) { showBottom(); return; }
    st.revealed = true;
    clearTimer();

    const secs = Math.floor((Date.now() - st.t0) / 1000);
    const s = st.s;
    const rec = Store.d.soup[s.id] || {};

    const surf = $('#surface');
    surf.classList.add('revealed');
    surf.innerHTML = `<div class="label">汤底 · BOTTOM</div><div class="text">${esc(s.bottom)}</div>`;

    let head, foot;
    if (fromGuess) {
      head = `<h3>你还原的经过</h3>
        <p style="background:rgba(84,208,196,.06);border:1px solid rgba(84,208,196,.18);border-radius:10px;padding:12px 14px;color:#d6e8e6">${esc(st.guess)}</p>`;
      foot = `<p>与真汤底对一对，对上了吗？</p>
        <div class="modal-foot">
          <button class="btn ghost" id="gNo">没对上</button>
          <button class="btn primary" id="gYes">对上了</button>
        </div>`;
    } else {
      head = `<h3>汤底</h3>`;
      foot = `<div class="modal-foot"><button class="btn ghost" onclick="Modal.close()">收好</button></div>`;
      if (!rec.solved) {
        Store.d.soup[s.id] = { solved: false, asks: st.asks, seen: true };
        Store.save();
      }
    }

    Modal.open(`${head}
      <p style="color:var(--gold);border-top:1px solid var(--line);padding-top:14px;line-height:1.9">${esc(s.bottom)}</p>
      <p style="color:var(--dim);font-size:12.5px">本次共提问 ${st.asks} 次 · 用时 ${fmtTime(secs * 1000)} · 用了 ${st.hints} 条提示</p>
      ${foot}`);

    if (fromGuess) {
      $('#gYes').onclick = () => {
        let pts = st.asks <= 8 ? 40 : st.asks <= 15 ? 30 : st.asks <= 25 ? 20 : 12;
        pts = Math.max(5, pts - st.hints * 5);
        const first = !(Store.d.soup[s.id] && Store.d.soup[s.id].solved);
        Store.d.soup[s.id] = { solved: true, asks: st.asks, best: Math.min(st.asks, rec.asks || 999) };
        Store.save();
        if (first) Store.addPts(pts);
        Sfx.win();
        Modal.close();
        toast(first ? `揭开汤底 +${pts} 分` : '已揭过，不再计分', 'gold');
        appendMsg('a', `汤底已揭${first ? `，酬金 +${pts}` : ''}。`, 'hint');
      };
      $('#gNo').onclick = () => {
        Store.d.soup[s.id] = { solved: false, asks: st.asks, seen: true };
        Store.save();
        Modal.close();
        toast('差一点，下回再说', '');
      };
    }

    $('#btnSubmit').textContent = '再看汤底';
    $('#btnBottom').textContent = '换一锅';
    $('#btnBottom').onclick = () => App.nav('soup', true);
  }

  function showBottom() {
    Modal.open(`<h3>汤底</h3>
      <p style="color:var(--gold);line-height:1.9">${esc(st.s.bottom)}</p>
      <div class="modal-foot"><button class="btn ghost" onclick="Modal.close()">收好</button></div>`);
  }

  /* ============================================================
   *  多人同屏（一人主持，其余轮流提问）
   * ============================================================ */
  function mSetup() {
    clearTimer();
    const opts = SOUPS.map((s, i) => `<option value="${s.id}">${esc(s.title)}（${s.lv}）</option>`).join('');
    $('#view').innerHTML = `
      <div class="page-head">
        <div class="kicker">PARTY · 同桌查案</div>
        <h1>海龟汤 · 多人同屏</h1>
      </div>
      ${modeBar('multi')}
      <p class="soup-m-intro">同桌查案：选一人<b>执底</b>（拿着汤底），其余 <b>猜客</b> 轮流向执底人提是非题，只答「是」「否」「无关」。谁先还原出整个故事，谁的分最高——问得越准，分越多。一部手机传着玩，不问服务器。</p>
      <div class="card sm-setup">
        <div class="field">
          <label>选一锅汤</label>
          <select id="smCase" class="input">${opts}<option value="__rand__">🎲 随机一锅</option></select>
        </div>
        <div class="field">
          <label>猜客人数（主持人另算）</label>
          <div class="seg" id="smN">
            ${SOUP_MULTI.players.map((n, i) => `<button class="seg-btn ${i === 0 ? 'on' : ''}" data-n="${n}">${n} 人</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>猜客昵称（可改）</label>
          <div class="sm-names" id="smNames"></div>
        </div>
        <div class="spread" style="margin-top:6px">
          <span class="muted sm">计分：基础 ${SOUP_MULTI.base} 分，每问一题 −${SOUP_MULTI.perQ}，猜错一次 −${SOUP_MULTI.wrongGuess}</span>
          <button class="btn primary" id="smStart">发汤，开局</button>
        </div>
      </div>`;

    let n = SOUP_MULTI.players[0];
    const renderNames = () => {
      $('#smNames').innerHTML = Array.from({ length: n }, (_, i) =>
        `<input class="input sm-name" data-i="${i}" value="玩家${i + 1}" maxlength="8">`).join('');
    };
    renderNames();
    $$('#smN .seg-btn').forEach(b => b.onclick = () => {
      $$('#smN .seg-btn').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); n = +b.dataset.n; renderNames();
    });
    $('#smStart').onclick = () => {
      const cid = $('#smCase').value;
      const s = cid === '__rand__' ? SOUPS[Math.floor(Math.random() * SOUPS.length)] : SOUPS.find(x => x.id === cid);
      const names = $$('#smNames .sm-name').map(i => i.value.trim() || `玩家${+i.dataset.i + 1}`);
      mInit(s, names);
    };
  }

  function mInit(s, names) {
    st = {
      s,
      players: names.map(nm => ({ name: nm, wrong: 0 })),
      cur: 0,
      qCount: 0,
      log: [],
      pending: null,
      guessPending: null,
      over: false,
      timer: null,
    };
    mRender();
  }

  function mRender() {
    const s = st.s;
    const turn = st.players[st.cur];
    const hostPanel = `
      <div class="sm-host">
        <div class="sm-host-h" onclick="this.parentNode.classList.toggle('open')">
          <span>执底人须知 · 仅执底者可见（点开看汤底）</span><span class="sm-caret">▾</span>
        </div>
        <div class="sm-host-b">
          <div class="sm-host-title">${esc(s.title)}</div>
          <div class="sm-surface"><b>开局：</b>${esc(s.surface)}</div>
          <div class="sm-bottom"><b>汤底：</b>${esc(s.bottom)}</div>
        </div>
      </div>`;

    const logHtml = st.log.length
      ? `<div class="sm-log">${st.log.map(en => {
          if (en.t === 'q') return `<div class="sm-row q"><span class="sm-who">${esc(en.who)}</span>问：${esc(en.text)}<span class="sm-ans ans-${en.a}">${en.a === 'yes' ? '是' : en.a === 'no' ? '否' : '无关'}</span></div>`;
          if (en.t === 'g') return `<div class="sm-row g"><span class="sm-who">${esc(en.who)}</span>猜：${esc(en.text)}<span class="sm-ans ans-${en.a}">${en.a === 'ok' ? '✓ 还原' : '✗ 偏了'}</span></div>`;
          return '';
        }).join('')}</div>`
      : `<div class="sm-log empty">还没人开口。轮到 <b>${esc(turn.name)}</b> 发问。</div>`;

    $('#view').innerHTML = `
      <div class="page-head">
        <div class="spread">
          <div>
            <div class="kicker">${s.tags.map(t => '#' + t).join('  ')} · ${s.lv}</div>
            <h1>海龟汤 · 多人同屏</h1>
          </div>
          <button class="btn ghost sm" id="smQuit">重开</button>
        </div>
        <p class="sm-surface">${esc(s.surface)}</p>
      </div>
      ${hostPanel}
      <div class="card sm-board">
        <div class="sm-turn">当前回合：<b>${esc(turn.name)}</b>
          <span class="sm-sub">第 ${st.qCount + 1} 问 · 共 ${st.players.length} 名猜客轮转</span>
        </div>
        ${st.guessPending
          ? `<div class="sm-guessbox">
               <div class="sm-gh">${esc(st.guessPending.who)} 的还原，请执底人判定：</div>
               <div class="sm-gh-text">${esc(st.guessPending.text)}</div>
               <div class="sm-host-btns">
                 <button class="btn primary" id="smGuessOk">对，还原了</button>
                 <button class="btn ghost" id="smGuessNo">还差得远</button>
               </div>
             </div>`
          : st.pending
          ? `<div class="sm-askbox">
               <div class="sm-ah">${esc(st.pending.who)} 问：${esc(st.pending.text)}</div>
               <div class="sm-host-btns">
                 <button class="btn primary" data-v="yes">是</button>
                 <button class="btn" data-v="no">否</button>
                 <button class="btn ghost" data-v="irr">无关</button>
               </div>
             </div>`
          : `<div class="sm-askbox">
               <input id="smQ" class="input" placeholder="${esc(turn.name)}，写下你的是非题（回车即问）" maxlength="60">
               <div class="sm-actions">
                 <button class="btn primary" id="smAsk">发问</button>
                 <button class="btn ghost" id="smGuessBtn">我猜汤底</button>
               </div>
             </div>`}
        ${logHtml}
      </div>`;

    $('#smQuit').onclick = () => App.nav('soup/multi', true);
    if (st.guessPending) {
      $('#smGuessOk').onclick = () => mResolve(true);
      $('#smGuessNo').onclick = () => mResolve(false);
    } else if (st.pending) {
      $$('.sm-host-btns [data-v]').forEach(b => b.onclick = () => mAnswer(b.dataset.v));
    } else {
      const q = $('#smQ');
      const ask = () => {
        const t = q.value.trim();
        if (!t) return;
        st.pending = { who: turn.name, text: t };
        st.qCount++;
        mRender();
        Sfx.tick && Sfx.tick();
      };
      q.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
      $('#smAsk').onclick = ask;
      $('#smGuessBtn').onclick = () => {
        const t = prompt(`${turn.name}，把你还原的经过写下来（越完整越好）：`);
        if (!t || !t.trim()) return;
        st.guessPending = { who: turn.name, text: t.trim() };
        mRender();
      };
    }
  }

  function mAnswer(v) {
    st.log.push({ t: 'q', who: st.pending.who, text: st.pending.text, a: v });
    st.pending = null;
    st.cur = (st.cur + 1) % st.players.length;
    mRender();
  }

  function mResolve(ok) {
    const g = st.guessPending;
    st.log.push({ t: 'g', who: g.who, text: g.text, a: ok ? 'ok' : 'no' });
    st.guessPending = null;
    if (ok) return mWin(g.who);
    const p = st.players.find(x => x.name === g.who);
    if (p) p.wrong++;
    st.cur = (st.cur + 1) % st.players.length;
    mRender();
  }

  function mWin(name) {
    st.over = true;
    clearTimer();
    const p = st.players.find(x => x.name === name);
    const score = Math.max(10, SOUP_MULTI.base - st.qCount * SOUP_MULTI.perQ - (p ? p.wrong : 0) * SOUP_MULTI.wrongGuess);
    // 进度
    const d = Store.d.sm = Store.d.sm || {};
    d.games = (d.games || 0) + 1;
    d.wins = (d.wins || 0) + 1;
    if (Store.d.sm.best == null || score > Store.d.sm.best) Store.d.sm.best = score;
    Store.save();
    Sfx.win && Sfx.win();
    $('#view').innerHTML = `
      <div class="page-head"><div class="kicker">GAME OVER</div><h1>${esc(name)} 揭了底</h1></div>
      <div class="verdict-box">
        <div class="big">${score}</div>
        <div class="tag gold">${st.qCount} 问 · 基础 ${SOUP_MULTI.base}</div>
        <p style="margin:14px 0 0;line-height:1.9">${esc(st.s.bottom)}</p>
        <div class="spread" style="margin-top:18px">
          <button class="btn ghost" onclick="App.nav('soup/multi',true)">再来一锅</button>
          <button class="btn primary" onclick="App.nav('home',true)">回大厅</button>
        </div>
      </div>`;
  }

  return { page };
})();

</script>
<script>
/* ============ 来找茬 ============ */
const Spot = (() => {
  /* 这些是纯背景，点到不算失误（注意：不能把任何 diff 元素放进来） */
  const IGNORE = ['wall', 'wall2', 'floor', 'floor2', 'counter', 'window', 'sky', 'sea', 'pier', 'ground', 'road', 'ceil'];

  let st = null;

  function page(id) {
    if (!id) return list();
    const sc = SPOTS.find(x => x.id === id);
    if (!sc) return list();
    play(sc);
  }

  function list() {
    const d = Store.d.spot || {};
    $('#view').innerHTML = `
      <div class="page-head">
        <div class="kicker">SPOT THE DIFFERENCE · 现场比对</div>
        <h1>来找茬</h1>
        <p>两幅画出自同一间屋子、同一个时辰，其中一幅被人改过十处。</p>
        
      </div>
      <div class="board-grid">
        ${SPOTS.map(sc => {
          const rec = d[sc.id];
          return `<a class="board" href="#/spot/${sc.id}" data-go="spot/${sc.id}">
            <div class="board-icon">🖼</div>
            <h3>${sc.title}</h3>
            <p class="desc">${sc.hint}</p>
            <div class="meta">
              <span class="tag cyan">${sc.diffs.length} 处不同</span>
              <span class="tag">${sc.lv}</span>
              ${rec && rec.best ? `<span class="tag green">最佳 ${fmtTime(rec.best)}</span>` : `<span class="tag gold">未勘破</span>`}
            </div>
          </a>`;
        }).join('')}
      </div>`;
  }

  function svgOf(scene, side) {
    const patches = {};
    if (side === 'B') scene.diffs.forEach(d => { patches[d.id] = d; });
    const body = scene.items.map(it => {
      const g = renderSpotItem(it, patches[it.id]);
      return IGNORE.includes(it.id) ? g.replace('<g data-id=', '<g style="pointer-events:none" data-id=') : g;
    }).join('');
    return `<svg viewBox="${scene.viewBox}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
  }

  function play(sc) {
    clearInterval(st && st.timer);
    st = {
      sc,
      found: new Set(),
      miss: 0,
      hintUsed: 0,
      t0: Date.now(),
      over: false,
    };

    $('#view').innerHTML = `
      <div class="page-head">
        <div class="spread">
          <div>
            <div class="kicker">现场比对 · ${sc.lv}</div>
            <h1>${esc(sc.title)}</h1>
            <p style="margin-top:6px">${esc(sc.hint)}</p>
          </div>
          <a class="btn ghost sm" href="#/spot" data-go="spot">← 换个现场</a>
        </div>
      </div>

      <div class="spot-stage">
        <div class="spot-pane" id="paneA" data-side="A">
          <span class="pane-tag">A · 原图</span>
          ${svgOf(sc, 'A')}
        </div>
        <div class="spot-pane" id="paneB" data-side="B">
          <span class="pane-tag">B · 改动在这一侧（两侧都可点）</span>
          ${svgOf(sc, 'B')}
        </div>
      </div>

      <div class="spot-hud">
        <div class="dots" id="dots">${sc.diffs.map(() => '<i></i>').join('')}</div>
        <span class="tag" id="spCount">0 / ${sc.diffs.length}</span>
        <span class="tag cyan" id="spTime">00:00</span>
        <span class="tag red" id="spMiss">失误 0</span>
        <button class="btn sm ghost" id="spHint">提示（折 10 分）</button>
        <button class="btn sm ghost" id="spRestart">重来</button>
      </div>

      <div class="card" style="margin-top:20px">
        <b style="font-family:var(--serif);letter-spacing:.08em">已找到的不同</b>
        <div id="foundList" class="empty">还没有找到任何一处。开始扫吧。</div>
      </div>`;

    // 顶层热区：保证每处不同都有一块「点得到」的区域，不被后绘制的图形盖住
    ['A', 'B'].forEach(side => {
      const pane = $(`#pane${side}`);
      addHotzones(sc, pane);
      pane.querySelector('svg').addEventListener('click', e => {
        const hot = e.target.closest('[data-hit]');
        if (hot) return handle(hot.dataset.hit, hot.closest('svg'));
        const g = e.target.closest('[data-id]');
        if (!g) return;
        handle(g.dataset.id, g);
      });
    });

    $('#spHint').onclick = useHint;
    $('#spRestart').onclick = () => play(sc);

    st.timer = setInterval(() => {
      if (st.over) return;
      const el = $('#spTime');
      if (el) el.textContent = fmtTime(Date.now() - st.t0);
    }, 300);
  }

  const NS = 'http://www.w3.org/2000/svg';

  /* 为每处不同在最上层铺一块透明热区 */
  function addHotzones(sc, pane) {
    const svg = pane.querySelector('svg');
    const old = svg.querySelector('.hotlayer');
    if (old) old.remove();
    const layer = document.createElementNS(NS, 'g');
    layer.setAttribute('class', 'hotlayer');

    // 严格按 items 的绘制顺序铺热区 —— 后画的图形盖在上面，热区也一样
    const zones = [];
    sc.items.forEach(item => {
      const d = sc.diffs.find(x => x.id === item.id);
      if (!d) return;
      let box = null;
      if (item && item.hz) {                       // 手工指定的热区（大色块元素用）
        box = { x: item.hz[0], y: item.hz[1], width: item.hz[2], height: item.hz[3] };
      } else {
        const g = svg.querySelector(`g[data-id="${d.id}"]`);
        if (!g) return;
        let bb;
        try { bb = g.getBBox(); } catch (e) { return; }
        if (!bb || (!bb.width && !bb.height)) return;
        box = { x: bb.x - 5, y: bb.y - 5, width: bb.width + 10, height: bb.height + 10 };
      }
      zones.push({ id: d.id, box });
    });

    zones.forEach(z => {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', z.box.x);
      r.setAttribute('y', z.box.y);
      r.setAttribute('width', Math.max(20, z.box.width));
      r.setAttribute('height', Math.max(20, z.box.height));
      r.setAttribute('fill', 'transparent');
      r.setAttribute('data-hit', z.id);
      layer.appendChild(r);
    });
    svg.appendChild(layer);
  }

  function handle(id, ref) {
    if (st.over) return;
    if (IGNORE.includes(id)) return;
    const pane = ref.closest('.spot-pane');
    if (!pane) return;

    const isDiff = st.sc.diffs.some(d => d.id === id);

    if (isDiff) {
      if (st.found.has(id)) return;
      st.found.add(id);
      markFound(id);
      Sfx.good();
      const d = st.sc.diffs.find(x => x.id === id);
      renderFound();
      toast(d.desc, 'green');
      if (st.found.size === st.sc.diffs.length) finish();
    } else {
      st.miss++;
      Sfx.bad();
      markMiss(id, pane);
      $('#spMiss').textContent = '失误 ' + st.miss;
      pane.classList.add('shake');
      setTimeout(() => pane.classList.remove('shake'), 360);
    }
    updateCount();
  }

  /* 在两幅图的对应元素上画圈 */
  function markFound(id) {
    ['A', 'B'].forEach(side => {
      const pane = $(`#pane${side}`);
      if (!pane) return;
      const g = pane.querySelector(`svg g[data-id="${id}"]`);
      if (!g) return;
      let bb;
      try { bb = g.getBBox(); } catch (e) { return; }
      const svg = pane.querySelector('svg');
      const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
      const r = Math.max(bb.width, bb.height) / 2 + 9;
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
      c.setAttribute('fill', 'none');
      c.setAttribute('stroke', '#8fb07a');
      c.setAttribute('stroke-width', '2.5');
      c.setAttribute('class', 'ring');
      c.setAttribute('stroke-dasharray', '5 4');
      svg.appendChild(c);
      pane.classList.add('hit');
      setTimeout(() => pane.classList.remove('hit'), 400);
    });

    const dots = $$('#dots i');
    if (dots[st.found.size - 1]) dots[st.found.size - 1].classList.add('found');
  }

  function markMiss(id, pane) {
    const g = pane.querySelector(`svg g[data-id="${id}"]`);
    const svg = pane.querySelector('svg');
    if (!g || !svg) return;
    let bb;
    try { bb = g.getBBox(); } catch (e) { return; }
    const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2, r = 11;
    const grp = document.createElementNS(NS, 'g');
    grp.setAttribute('class', 'miss-mark');
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
    c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#c4564a'); c.setAttribute('stroke-width', '2.5');
    const l1 = document.createElementNS(NS, 'line');
    l1.setAttribute('x1', cx - 5); l1.setAttribute('y1', cy - 5);
    l1.setAttribute('x2', cx + 5); l1.setAttribute('y2', cy + 5);
    const l2 = document.createElementNS(NS, 'line');
    l2.setAttribute('x1', cx + 5); l2.setAttribute('y1', cy - 5);
    l2.setAttribute('x2', cx - 5); l2.setAttribute('y2', cy + 5);
    [l1, l2].forEach(l => { l.setAttribute('stroke', '#c4564a'); l.setAttribute('stroke-width', '2.5'); l.setAttribute('stroke-linecap', 'round'); });
    grp.append(c, l1, l2);
    svg.appendChild(grp);
    setTimeout(() => grp.remove(), 820);
  }

  function useHint() {
    if (st.over) return;
    const rest = st.sc.diffs.filter(d => !st.found.has(d.id));
    if (!rest.length) return;
    st.hintUsed++;
    const d = rest[Math.floor(Math.random() * rest.length)];
    ['A', 'B'].forEach(side => {
      const pane = $(`#pane${side}`);
      const g = pane && pane.querySelector(`svg g[data-id="${d.id}"]`);
      if (!g) return;
      let bb;
      try { bb = g.getBBox(); } catch (e) { return; }
      const svg = pane.querySelector('svg');
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', bb.x + bb.width / 2);
      c.setAttribute('cy', bb.y + bb.height / 2);
      c.setAttribute('r', Math.max(bb.width, bb.height) / 2 + 14);
      c.setAttribute('fill', 'rgba(224,169,75,.16)');
      c.setAttribute('stroke', '#e0a94b');
      c.setAttribute('stroke-width', '2.5');
      c.setAttribute('class', 'miss-mark');
      svg.appendChild(c);
      setTimeout(() => c.remove(), 2200);
    });
    toast('这一处有问题。', 'gold');
    Sfx.tick();
  }

  function updateCount() {
    $('#spCount').textContent = `${st.found.size} / ${st.sc.diffs.length}`;
  }

  function renderFound() {
    const box = $('#foundList');
    const got = st.sc.diffs.filter(d => st.found.has(d.id));
    if (!got.length) { box.className = 'empty'; box.textContent = '还没有找到任何一处。开始扫吧。'; return; }
    box.className = 'row';
    box.innerHTML = got.map(d => `<span class="tag green">✓ ${esc(d.desc)}</span>`).join('');
  }

  function finish() {
    st.over = true;
    clearInterval(st.timer);
    const ms = Date.now() - st.t0;
    const sec = ms / 1000;

    let pts = 60;
    if (sec < 60) pts += 30; else if (sec < 120) pts += 15; else if (sec < 240) pts += 5;
    pts -= st.miss * 3;
    pts -= st.hintUsed * 10;
    pts = Math.max(5, Math.round(pts));

    const rec = Store.d.spot[st.sc.id] || { clears: 0 };
    const isBest = !rec.best || ms < rec.best;
    Store.d.spot[st.sc.id] = {
      clears: rec.clears + 1,
      best: isBest ? ms : rec.best,
    };
    Store.save();
    Store.addPts(pts);
    Sfx.win();

    const rank = pts >= 85 ? '鹰眼' : pts >= 65 ? '老手' : pts >= 45 ? '合格' : '勉强';

    Modal.open(`
      <h3>十处都找齐了</h3>
      <div class="score-ring">
        <div class="big">${pts}</div>
        <div>
          <div class="tag gold">${rank}</div>
          <div style="margin-top:8px;color:var(--muted);font-size:13px">
            用时 ${fmtTime(ms)} · 失误 ${st.miss} 次 · 提示 ${st.hintUsed} 次
          </div>
          ${isBest ? '<div style="margin-top:6px;color:var(--green);font-size:13px">新纪录</div>' : ''}
        </div>
      </div>
      <p style="color:var(--dim);font-size:13px">${st.sc.diffs.length} 处不同：${st.sc.diffs.map(d => esc(d.desc)).join('、')}。</p>
      <div class="modal-foot">
        <a class="btn ghost" href="#/spot" data-go="spot">换个现场</a>
        <button class="btn primary" onclick="Modal.close();Spot.replay()">再来一次</button>
      </div>`);
  }

  function replay() {
    if (st) play(st.sc);
  }

  return { page, replay, get found() { return st ? [...st.found] : []; } };
})();

</script>
<script>
/* ============ 卷宗调查 ============ */
const Case = (() => {
  const MIN = 8;            // 结案所需的最少线索数
  let st = null;

  function page(id, sub) {
    if (!id) return list();
    const c = CASES.find(x => x.id === id);
    if (!c) return list();
    if (sub === 'verdict') return verdictPage(c);
    play(c);
  }

  function list() {
    const d = Store.d.cases || {};
    $('#view').innerHTML = `
      <div class="page-head">
        <div class="kicker">COLD CASE · 卷宗调查</div>
        <h1>卷宗调查</h1>
        <p>案子结了，卷宗没结——读现场、翻物证、对时间表，抄够八条线索再签字。</p>
        
      </div>
      <div class="board-grid">
        ${CASES.map(c => {
          const rec = d[c.id];
          return `<a class="board" href="#/case/${c.id}" data-go="case/${c.id}">
            <div class="board-icon">${ICON.case}</div>
            <h3>${esc(c.title)}</h3>
            <p class="desc">${esc(c.sub)}</p>
            <div class="meta">
              ${c.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
              <span class="tag">${c.lv}</span>
              ${rec && rec.solved ? `<span class="tag green">已结案 ${rec.score} 分</span>` : `<span class="tag gold">未结</span>`}
            </div>
          </a>`;
        }).join('')}
      </div>`;
  }

  function play(c) {
    st = { c, cur: c.scenes[0].id, got: {}, ans: {}, done: false };

    $('#view').innerHTML = `
      <div class="page-head">
        <div class="spread">
          <div>
            <div class="kicker">COLD CASE · ${c.tags.map(t => '#' + t).join(' ')}</div>
            <h1>${esc(c.title)}</h1>
            <p style="margin-top:6px">${esc(c.sub)}</p>
          </div>
          <a class="btn ghost sm" href="#/case" data-go="case">← 档案架</a>
        </div>
      </div>

      <div class="case-wrap">
        <nav class="case-nav" id="sceneNav">
          ${c.scenes.map(s => `<button class="scene-btn" data-sc="${s.id}">${esc(s.name)}
            <span class="cnt" id="cnt-${s.id}"></span></button>`).join('')}
        </nav>

        <div>
          <div class="card">
            <div class="brief" id="brief" style="white-space:pre-wrap"></div>
          </div>
          <div id="verdictArea" style="margin-top:16px"></div>
        </div>

        <aside class="notes">
          <h4>查案笔记</h4>
          <div class="sub" id="noteSub">已录 0 / ${MIN} 条</div>
          <div class="note-list" id="noteList"></div>
          <button class="btn primary" id="btnClose" style="margin-top:14px" disabled>结案报告</button>
        </aside>
      </div>`;

    $$('#sceneNav .scene-btn').forEach(b => {
      b.onclick = () => { st.cur = b.dataset.sc; renderScene(); };
    });
    $('#btnClose').onclick = () => App.nav('case/' + c.id + '/verdict', true);

    renderScene();
    renderNotes();
  }

  /* 结案报告：单独一页，答题 + 递交 */
  function verdictPage(c) {
    if (!st || st.c.id !== c.id) st = { c, cur: c.scenes[0].id, got: {}, ans: {}, done: false };
    st.ans = {}; st.done = false;
    const total = Object.keys(c.clues).length;
    const got = Object.keys(st.got).length;
    $('#view').innerHTML = `
      <div class="page-head">
        <div class="spread">
          <div>
            <div class="kicker">COLD CASE · 结案报告</div>
            <h1>${esc(c.title)}</h1>
            <p style="margin-top:6px">已录 ${got} / ${total} 条线索。答完四问，签字结案。</p>
          </div>
          <a class="btn ghost sm" href="#/case/${c.id}" data-go="case/${c.id}">← 再看现场</a>
        </div>
        
      </div>

      <div class="card">
        ${c.questions.map((q, i) => `
          <div class="q-block" data-q="${i}">
            <div class="q-t">${i + 1}. ${esc(q.q)}</div>
            <div class="q-opts" data-q="${i}">
              ${q.opts.map(o => `<button class="q-opt" data-v="${o.v}">${esc(o.t)}</button>`).join('')}
            </div>
          </div>`).join('')}
        <div class="row" style="justify-content:flex-end;margin-top:6px">
          <button class="btn ghost" onclick="App.nav('case/${c.id}',true)">再查查</button>
          <button class="btn primary" id="btnJudge">递交结案报告</button>
        </div>
      </div>
      <div id="verdictArea" style="margin-top:16px"></div>`;

    $$('.q-opt').forEach(b => {
      b.onclick = () => {
        const qi = b.closest('.q-opts').dataset.q;
        st.ans[qi] = b.dataset.v;
        $$(`.q-opts[data-q="${qi}"] .q-opt`).forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        Sfx.tick();
      };
    });
    $('#btnJudge').onclick = judge;
    st.done = false;
  }

  function renderScene() {
    const sc = st.c.scenes.find(x => x.id === st.cur);
    $$('#sceneNav .scene-btn').forEach(b => b.classList.toggle('on', b.dataset.sc === st.cur));

    const html = esc(sc.text).replace(/\[\[(\w+)\|([^\]]+)\]\]/g, (m, id, label) => {
      const got = st.got[id];
      return `<span class="hl ${got ? 'got' : ''}" data-clue="${id}">${label}</span>`;
    });
    $('#brief').innerHTML = html;

    $$('#brief .hl:not(.got)').forEach(el => {
      el.onclick = () => collect(el.dataset.clue, el);
    });

    // 顶部案情摘要常驻
    if (st.cur !== st.c.scenes[0].id) {
      const banner = document.createElement('p');
      banner.style.cssText = 'margin:0 0 14px;padding-bottom:12px;border-bottom:1px dashed var(--line);color:var(--dim);font-size:13px;line-height:1.7';
      banner.textContent = st.c.intro;
      $('#brief').prepend(banner);
    }

    st.c.scenes.forEach(s => {
      const el = $('#cnt-' + s.id);
      if (!el) return;
      const ids = [...s.text.matchAll(/\[\[(\w+)\|/g)].map(m => m[1]);
      const n = ids.filter(i => st.got[i]).length;
      el.textContent = `${n}/${ids.length}`;
      el.closest('.scene-btn').classList.toggle('done', n === ids.length && ids.length > 0);
    });
  }

  function collect(id, el) {
    if (st.got[id]) return;
    const c = st.c.clues[id];
    if (!c) return;
    st.got[id] = true;
    el.classList.add('got');
    el.onclick = null;
    Sfx.tick();
    toast(c.key ? '关键线索：' + c.t : '已录：' + c.t, c.key ? 'gold' : 'green');
    renderNotes();
    renderScene();
  }

  function renderNotes() {
    const ids = Object.keys(st.got);
    const box = $('#noteList');
    if (!ids.length) {
      box.innerHTML = `<div class="empty" style="padding:16px 0;font-size:12.5px">正文里划虚线的词<br>点一下就能录进来</div>`;
    } else {
      box.innerHTML = ids.map(id => {
        const c = st.c.clues[id];
        return `<div class="note ${c.key ? 'key' : ''}"><b>${c.key ? '★ 关键' : '线索'}</b>${esc(c.d)}</div>`;
      }).join('');
    }
    const sub = $('#noteSub');
    if (sub) {
      const total = Object.keys(st.c.clues).length;
      const need = ids.length >= MIN ? '可以签字了' : `还差 ${MIN - ids.length} 条`;
      sub.textContent = `已录 ${ids.length} / ${total} 条 · ${need}`;
    }
    const btn = $('#btnClose');
    if (btn && !st.done) btn.disabled = ids.length < MIN;
  }

  /* ---------- 结案 ---------- */
  function openVerdict() {
    if (Object.keys(st.got).length < MIN) return;
    $('#btnClose').disabled = true;
    $('#verdictArea').innerHTML = `
      <div class="card">
        <div class="spread" style="margin-bottom:14px">
          <b style="font-family:var(--serif);font-size:18px;letter-spacing:.08em">签字结案</b>
          <span class="tag">四问 · 每问 25 分</span>
        </div>
        ${st.c.questions.map((q, i) => `
          <div class="q-block" data-q="${i}">
            <div class="q-t">${i + 1}. ${esc(q.q)}</div>
            <div class="q-opts" data-q="${i}">
              ${q.opts.map(o => `<button class="q-opt" data-v="${o.v}">${esc(o.t)}</button>`).join('')}
            </div>
          </div>`).join('')}
        <div class="row" style="justify-content:flex-end">
          <button class="btn ghost" id="btnBack">再查查</button>
          <button class="btn primary" id="btnJudge">递交结案报告</button>
        </div>
      </div>`;

    $$('#verdictArea .q-opt').forEach(b => {
      b.onclick = () => {
        const qi = b.closest('.q-opts').dataset.q;
        st.ans[qi] = b.dataset.v;
        $$(`#verdictArea .q-opts[data-q="${qi}"] .q-opt`).forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        Sfx.tick();
      };
    });
    $('#btnJudge').onclick = judge;
    $('#btnBack').onclick = () => { $('#verdictArea').innerHTML = ''; $('#btnClose').disabled = false; };
    $('#verdictArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function judge() {
    if (Object.keys(st.ans).length < st.c.questions.length) {
      toast('还有问题没答', 'red');
      return;
    }
    st.done = true;

    let score = 0;
    st.c.questions.forEach((q, i) => {
      const right = st.ans[i] === q.ans;
      if (right) score += 25;
      $$(`#verdictArea .q-opts[data-q="${i}"] .q-opt`).forEach(b => {
        if (b.dataset.v === q.ans) b.classList.add('right');
        else if (b.dataset.v === st.ans[i]) b.classList.add('wrong');
      });
      const blk = $(`#verdictArea .q-block[data-q="${i}"]`);
      if (blk) {
        const p = document.createElement('div');
        p.style.cssText = `margin-top:11px;padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.8;
          background:${right ? 'rgba(95,208,138,.07)' : 'rgba(242,104,95,.07)'};
          border:1px solid ${right ? 'rgba(95,208,138,.25)' : 'rgba(242,104,95,.25)'}`;
        p.innerHTML = `<b style="color:${right ? 'var(--green)' : 'var(--red)'}">${right ? '✓ 正确' : '✗ 不对'}</b><br>
          <span style="color:var(--muted)">${esc(q.why)}</span>`;
        blk.appendChild(p);
      }
    });

    const keyIds = Object.keys(st.c.clues).filter(id => st.c.clues[id].key);
    const gotKey = keyIds.filter(id => st.got[id]).length;
    if (gotKey === keyIds.length) { score += 20; }

    const rec = Store.d.cases[st.c.id] || {};
    const first = !rec.solved;
    Store.d.cases[st.c.id] = { solved: true, score: Math.max(score, rec.score || 0) };
    Store.save();
    if (first) Store.addPts(score);
    Sfx.win();

    const box = document.createElement('div');
    box.className = 'card';
    box.style.marginTop = '16px';
    box.innerHTML = `
      <div class="verdict-box">
        <h3>结案报告</h3>
        <div class="score-ring">
          <div class="big">${score}</div>
          <div>
            <div class="tag ${score >= 90 ? 'green' : score >= 60 ? 'gold' : 'red'}">
              ${score >= 100 ? '铁案' : score >= 80 ? '出色' : score >= 50 ? '尚可' : '再查'}
            </div>
            <div style="margin-top:8px;color:var(--muted);font-size:13px">
              答对 ${st.c.questions.filter((q, i) => st.ans[i] === q.ans).length} / ${st.c.questions.length} 题
              · 关键线索 ${gotKey}/${keyIds.length}${gotKey === keyIds.length ? '（+20 缜密）' : ''}
            </div>
            ${first ? '' : '<div style="margin-top:6px;color:var(--dim);font-size:12px">重复结案，不再计酬</div>'}
          </div>
        </div>
        <div class="reveal-sec">
          <h5>真相 · THE TRUTH</h5>
          <p style="white-space:pre-wrap">${esc(st.c.truth)}</p>
          ${st.c.deception ? debriefHtml(st.c.deception, id => st.c.clues[id] && st.c.clues[id].t) : ''}
        </div>
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:14px">
        <a class="btn ghost" href="#/case" data-go="case">回档案架</a>
        <button class="btn primary" onclick="Case.replay()">重查一遍</button>
      </div>`;
    $('#verdictArea').appendChild(box);
    $('#btnJudge').disabled = true;
    setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'start' }), 200);
  }

  function replay() {
    if (st) play(st.c);
  }

  /* ---------- 欺骗结构复盘（真相页） ---------- */
  function debriefHtml(d, nameOf) {
    const frame = d.frame ? `<div class="debrief-frame"><span class="db-tag">表层误导</span>${esc(d.frame)}</div>` : '';
    const turns = (d.turns && d.turns.length)
      ? `<div class="debrief-turns">${d.turns.map((t, i) => `<div class="debrief-turn"><span class="db-tag">反转 ${i + 1}</span>${esc(t)}</div>`).join('')}</div>` : '';
    const flaws = (d.flaws && d.flaws.length)
      ? `<div class="debrief-flaws"><div class="db-h">致命破绽链</div>${d.flaws.map(f => {
          const nm = nameOf(f.k);
          return `<div class="debrief-flaw"><b>${nm ? esc(nm) : esc(f.k)}</b><span>${esc(f.t)}</span></div>`;
        }).join('')}</div>` : '';
    return `<div class="debrief">${frame}${turns}${flaws}</div>`;
  }

  return { page, replay };
})();

</script>
<script>
/* ============ 案发现场（赏金侦探加强版） ============
   核心循环：勘察场景取证 → 聊天盘问 NPC（脚本树 + 关键词自由问）→
   线索板收集证据 → 指认推理 → 多结局结算
*/
const Detect = (() => {
  const MIN = 6;            // 解锁「开始推理」所需的最少证据数

  let st = null;            // { c, scene, got:{}, asked:{npc:[ids]}, log:{npc:[msgs]}, mode, chatNpc, ans:{}, done }

  function page(id) {
    if (!id) return list();
    const c = DETECT.find(x => x.id === id);
    if (!c) return list();
    play(c);
  }

  /* ---------- 列表 ---------- */
  function list() {
    const d = Store.d.detect || {};
    $('#view').innerHTML = `
      <div class="page-head">
        <div class="kicker">CRIME SCENE · 现场勘查</div>
        <h1>案发现场</h1>
        <p>屋子还留着味道；物件不开口，人会。</p>
        
      </div>
      <div class="board-grid">
        ${DETECT.map(c => {
          const rec = d[c.id];
          return `<a class="board" href="#/detect/${c.id}" data-go="detect/${c.id}">
            <div class="board-icon">${ICON.detect}</div>
            <h3>${esc(c.title)}</h3>
            <p class="desc">${esc(c.tags.join(' · '))}</p>
            <div class="meta">
              ${c.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
              <span class="tag">${c.lv}</span>
              ${rec && rec.solved ? `<span class="tag green">已结案 ${rec.score} 分</span>` : `<span class="tag gold">未结</span>`}
            </div>
          </a>`;
        }).join('')}
      </div>`;
  }

  /* ---------- 开始调查 ---------- */
  function play(c) {
    const rec = (Store.d.detect && Store.d.detect[c.id]) || {};
    st = {
      c, scene: c.scenes[0].id,
      got: {}, asked: {}, log: {},
      mode: 'scene', chatNpc: null, ans: {}, done: false,
      solvedBefore: !!rec.solved,
    };
    c.npcs && Object.keys(c.npcs).forEach(n => { st.asked[n] = []; st.log[n] = []; });

    $('#view').innerHTML = `
      <div class="page-head">
        <div class="spread">
          <div>
            <div class="kicker">CRIME SCENE · ${c.tags.map(t => '#' + t).join(' ')}</div>
            <h1>${esc(c.title)}</h1>
            <p style="margin-top:6px;max-width:60ch">${esc(c.intro)}</p>
          </div>
          <a class="btn ghost sm" href="#/detect" data-go="detect">← 案卷架</a>
        </div>
      </div>

      <div class="scene-tabs" id="sceneTabs"></div>

      <div class="detect-wrap" id="detectWrap"></div>

      <div class="deduce-bar" id="deduceBar"></div>`;

    renderTabs();
    renderMain();
  }

  /* ---------- 场景标签 ---------- */
  function renderTabs() {
    const c = st.c;
    $('#sceneTabs').innerHTML = c.scenes.map(s => {
      const objN = s.objects.length;
      const gotN = s.objects.filter(o => objGot(o.id)).length;
      const npcN = s.npcs.length;
      return `<button class="scene-tab ${s.id === st.scene ? 'on' : ''}" data-sc="${s.id}">
        <span class="st-name">${s.name}</span>
        <span class="st-meta">物证 ${gotN}/${objN} · 人物 ${npcN}</span>
      </button>`;
    }).join('') + `
      <button class="scene-tab clue-tab" id="clueTabBtn">
        <span class="st-name">线索板</span>
        <span class="st-meta" id="clueCount">0 条</span>
      </button>`;

    $$('#sceneTabs .scene-tab[data-sc]').forEach(b => {
      b.onclick = () => { st.scene = b.dataset.sc; renderTabs(); renderMain(); };
    });
    const ct = $('#clueTabBtn');
    if (ct) ct.onclick = () => { st.mode = 'board'; renderMain(); };
    const cc = $('#clueCount');
    if (cc) cc.textContent = Object.keys(st.got).length + ' 条';
  }

  /* ---------- 主体（场景 / 线索板 / 聊天） ---------- */
  function renderMain() {
    // 底部推理栏只在「场景」视图显示；线索板自带按钮，聊天/结案时隐藏
    const bar = $('#deduceBar');
    if (bar) bar.style.display = (st.mode === 'scene') ? '' : 'none';
    if (st.mode === 'board') return renderBoard();
    if (st.mode === 'chat')  return renderChat();
    return renderScene();
  }

  /* 场景：取证 + 盘问 */
  function renderScene() {
    const c = st.c;
    const sc = c.scenes.find(x => x.id === st.scene);
    const evN = sc.objects.filter(o => objGot(o.id)).length;

    const objHtml = sc.objects.map(o => {
      const got = objGot(o.id);
      return `<button class="ev-item ${got ? 'got' : ''}" data-ev="${o.id}">
        <span class="ev-ic">${ICON.search}</span>
        <span class="ev-name">${esc(o.name)}</span>
        <span class="ev-hint">${got ? '已取证' : esc(o.hint)}</span>
      </button>`;
    }).join('');

    const npcHtml = sc.npcs.map(nid => {
      const n = c.npcs[nid];
      const asked = st.asked[nid].length;
      const total = n.asks.length;
      return `<button class="npc-chip" data-npc="${nid}" style="--nc:${n.color}">
        <span class="npc-av" style="background:${n.color}22;color:${n.color}">${esc(n.name[0])}</span>
        <span class="npc-meta">
          <b>${esc(n.name)}</b><i>${esc(n.role)}</i>
        </span>
        <span class="npc-prog">${asked}/${total} 问</span>
      </button>`;
    }).join('');

    $('#detectWrap').innerHTML = `
      <section class="scene-panel">
        <div class="scene-head">
          <h3>${esc(sc.name)}</h3>
          <span class="tag">物证 ${evN}/${sc.objects.length}</span>
        </div>
        <p class="scene-desc">${esc(sc.desc)}</p>
        <div class="ev-grid">${objHtml}</div>
        <div class="npc-sec">
          <h4>在场人物 · 点开盘问</h4>
          <div class="npc-row">${npcHtml}</div>
        </div>
      </section>
      ${boardAside()}`;

    $$('#detectWrap .ev-item:not(.got)').forEach(b => {
      b.onclick = () => collectEvidence(b.dataset.ev, b);
    });
    $$('#detectWrap .npc-chip').forEach(b => {
      b.onclick = () => { st.mode = 'chat'; st.chatNpc = b.dataset.npc; renderMain(); };
    });

    renderDeduceBar();
  }

  /* 线索板 */
  function renderBoard() {
    const c = st.c;
    const ids = Object.keys(st.got);
    const total = Object.keys(c.evidence).length;
    const keyGot = ids.filter(i => c.evidence[i] && c.evidence[i].key).length;
    const keyAll = Object.values(c.evidence).filter(e => e.key).length;

    const cards = ids.length ? ids.map(i => {
      const e = c.evidence[i];
      return `<div class="clue-card ${e.key ? 'key' : ''}" data-cat="${e.cat}">
        <div class="clue-top"><b>${e.key ? '★ ' : ''}${esc(e.t)}</b><span class="clue-cat">${esc(e.cat)}</span></div>
        <p>${esc(e.d)}</p>
      </div>`;
    }).join('') : `<div class="empty">板上还空着。<br>回现场点物件，或找人问话。</div>`;

    $('#detectWrap').innerHTML = `
      <section class="board-panel">
        <div class="board-head">
          <h3>线索板</h3>
